  <body>
    <div id="root"></div>
    <script id="boot-check">
      // If the app fails before it can start, show why instead of a blank page.
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) { errs.push(e.message || String(e.error || 'Unknown error')); });
        window.addEventListener('unhandledrejection', function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.children.length) {
            root.innerHTML = '<div style="max-width:620px;margin:15vh auto;padding:0 24px;color:#ece6da;font-family:system-ui,sans-serif">' +
              '<h1 style="font-size:28px;margin:0 0 12px">The test version did not start</h1>' +
              '<p style="color:#c9c3b8">Try refreshing. If that does not help, reset the saved test data.</p>' +
              '<button id="boot-reset" style="margin-top:12px;padding:12px 20px;background:#c6a66c;border:0;color:#151513;font-weight:600;cursor:pointer">Reset test data and reload</button>' +
              '<p style="margin-top:20px;font:12px ui-monospace,monospace;color:#a7a196;overflow-wrap:anywhere">Details for Seb: ' + (errs.join(' | ') || 'no error reported') + '</p></div>';
            document.getElementById('boot-reset').onclick = function () { try { localStorage.removeItem('fieldprint-stage-a-v1'); } catch (x) {} location.hash = '/'; location.reload(); };
          }
        }, 4000);
      })();
    </script>
